name: Deploy File Tree Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/file_tree.yml'
      - '.github/pages/file_tree.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Directory Tree and Global Search Index
        run: |
          set -euo pipefail

          TEMPLATE_PATH=".github/pages/file_tree.html"
          if [ ! -f "${TEMPLATE_PATH}" ]; then
            echo "[ERROR] Template ${TEMPLATE_PATH} not found."
            exit 1
          fi

          echo "[INFO] Generating index.html and search_index.json..."
          python3 - << 'EOF'
          import os, json

          template_path = ".github/pages/file_tree.html"
          with open(template_path, "r", encoding="utf-8") as f:
              template_html = f.read()

          repo_root = "."
          exclude_dirs = {".git", ".github"}

          def get_dir_size(dir_path):
              total_size = 0
              try:
                  for root_dir, _, file_names in os.walk(dir_path):
                      for fn in file_names:
                          fp = os.path.join(root_dir, fn)
                          if os.path.isfile(fp):
                              total_size += os.path.getsize(fp)
              except Exception:
                  pass
              return total_size

          all_search_items = []

          for root, dirs, files in os.walk(repo_root):
              dirs[:] = [d for d in dirs if d not in exclude_dirs]
              rel_dir = os.path.relpath(root, repo_root)
              if rel_dir == ".":
                  rel_dir = ""

              items = []
              if rel_dir != "":
                  items.append({"name": "..", "path": "../", "type": "dir", "size": 0})

              for d in sorted(dirs):
                  dir_full_path = os.path.join(root, d)
                  dir_size = get_dir_size(dir_full_path)
                  items.append({"name": d, "path": f"./{d}/", "type": "dir", "size": dir_size})
                  rel_path = (os.path.join(rel_dir, d) + "/").replace("\\", "/")
                  all_search_items.append({"name": d, "path": rel_path, "type": "dir", "size": dir_size})

              for file in sorted(files):
                  if file.startswith(".") or file == "search_index.json":
                      continue
                  if file == "index.html" and rel_dir == "":
                      continue
                  file_path = os.path.join(root, file)
                  size = os.path.getsize(file_path) if os.path.isfile(file_path) else 0
                  items.append({"name": file, "path": f"./{file}", "type": "file", "size": size})
                  rel_path = os.path.join(rel_dir, file).replace("\\", "/")
                  all_search_items.append({"name": file, "path": rel_path, "type": "file", "size": size})

              index_content = template_html.replace(
                  "window.__TREE_DATA__ || []",
                  json.dumps(items, ensure_ascii=False)
              )

              target_index = os.path.join(root, "index.html")
              if not (rel_dir == "" and os.path.exists(target_index) and "__TREE_DATA__" not in open(target_index, encoding="utf-8", errors="ignore").read()):
                  with open(target_index, "w", encoding="utf-8") as f:
                      f.write(index_content)

          with open(os.path.join(repo_root, "search_index.json"), "w", encoding="utf-8") as f:
              json.dump(all_search_items, f, ensure_ascii=False)
          EOF
          echo "[INFO] Index pages and search index generated."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4