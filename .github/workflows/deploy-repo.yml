name: Build Flatpak Repo and Deploy Pages

on:
  schedule:
    - cron: '0 12 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "[INFO] Importing GPG private key..."
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Setup Flathub Repository
        run: |
          echo "[INFO] Adding Flathub remote repository..."
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak Packages and Repository
        env:
          GPG_KEY_ID: "C40563883002D85414F6517269B202E6183A72A2"
        run: |
          set -euo pipefail

          CONFIG_FILE=".github/env/get.yml"
          REPO_DIR="."
          BUILD_DIR="build-dir"

          if [ ! -f "${CONFIG_FILE}" ]; then
            echo "[ERROR] ${CONFIG_FILE} not found."
            exit 1
          fi

          if [ ! -d "${REPO_DIR}/objects" ]; then
            echo "[INFO] Initializing OSTree repository..."
            ostree init --mode=archive-z2 --repo="${REPO_DIR}"
          fi

          python3 - << 'EOF' > /tmp/flatpak_targets.tsv
          import re

          with open(".github/env/get.yml", "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  match = re.match(r"^([^:：]+)[:：]\s*(https?://\S+)", line)
                  if match:
                      app_name = match.group(1).strip()
                      manifest_url = match.group(2).strip()
                      print(f"{app_name}\t{manifest_url}")
          EOF

          while IFS=$'\t' read -r APP_NAME MANIFEST_URL || [ -n "${APP_NAME}" ]; do
            [ -z "${APP_NAME}" ] && continue
            echo "[INFO] Processing ${APP_NAME} from ${MANIFEST_URL}..."

            APP_TMP_DIR="tmp/${APP_NAME}"
            mkdir -p "${APP_TMP_DIR}"

            MANIFEST_EXT="${MANIFEST_URL##*.}"
            TEMP_MANIFEST="${APP_TMP_DIR}/manifest.${MANIFEST_EXT}"
            curl -fsSL "${MANIFEST_URL}" -o "${TEMP_MANIFEST}"

            APP_ID=$(python3 - << EOF
          import os, re, sys, urllib.parse, urllib.request

          manifest_path = "${TEMP_MANIFEST}"
          manifest_url = "${MANIFEST_URL}"
          target_dir = "${APP_TMP_DIR}"

          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          id_match = re.search(r'^\s*[\"\'\']?(?:id|app-id)[\"\'\']?\s*:\s*[\"\'\']?([^\"\'\'\s,#]+)[\"\'\']?', content, re.MULTILINE)
          if not id_match:
              sys.exit(1)

          app_id = id_match.group(1)

          paths = re.findall(r'[\"\'\']?path[\"\'\']?\s*:\s*[\"\'\']?([^\"\'\'\s,#]+)[\"\'\']?', content)
          base_url = manifest_url.rsplit("/", 1)[0] + "/"

          for p in paths:
              if p.startswith("http://") or p.startswith("https://") or p.startswith("/"):
                  continue
              file_url = urllib.parse.urljoin(base_url, p)
              dest_path = os.path.join(target_dir, p)
              os.makedirs(os.path.dirname(dest_path), exist_ok=True)
              req = urllib.request.Request(file_url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as resp, open(dest_path, "wb") as out_f:
                  out_f.write(resp.read())

          print(app_id)
          EOF
          )

            if [ -z "${APP_ID}" ]; then
              echo "[ERROR] Could not extract app ID for ${APP_NAME}."
              exit 1
            fi

            echo "[INFO] Building ${APP_ID}..."
            flatpak-builder \
              --user \
              --install-deps-from=flathub \
              --disable-rofiles-fuse \
              --gpg-sign="${GPG_KEY_ID}" \
              --repo="${REPO_DIR}" \
              --force-clean \
              "${BUILD_DIR}" \
              "${TEMP_MANIFEST}"

            echo "[INFO] Creating single-file bundle: ${APP_NAME}.flatpak..."
            flatpak build-bundle \
              --gpg-sign="${GPG_KEY_ID}" \
              "${REPO_DIR}" \
              "${APP_NAME}.flatpak" \
              "${APP_ID}"

            rm -rf "${APP_TMP_DIR}" "${BUILD_DIR}"
          done < /tmp/flatpak_targets.tsv

          rm -rf tmp /tmp/flatpak_targets.tsv .flatpak-builder 2>/dev/null || true

          echo "[INFO] Updating repository summary and static deltas..."
          flatpak build-update-repo \
            --gpg-sign="${GPG_KEY_ID}" \
            --generate-static-deltas \
            "${REPO_DIR}"

          echo "[INFO] OSTree repository and flatpak bundles generated successfully."

      - name: Generate Directory Tree Index Pages
        run: |
          set -euo pipefail

          TEMPLATE_PATH=".github/pages/file_tree.html"
          if [ ! -f "${TEMPLATE_PATH}" ]; then
            echo "[WARN] Template ${TEMPLATE_PATH} not found. Skipping file tree index generation."
            exit 0
          fi

          echo "[INFO] Generating index.html for all repository directories with directory sizes..."
          python3 - << 'EOF'
          import os, json

          template_path = ".github/pages/file_tree.html"
          with open(template_path, "r", encoding="utf-8") as f:
              template_html = f.read()

          repo_root = "."
          exclude_dirs = {".git", ".github"}

          def get_dir_size(dir_path):
              total_size = 0
              try:
                  for root_dir, _, file_names in os.walk(dir_path):
                      for fn in file_names:
                          fp = os.path.join(root_dir, fn)
                          if os.path.isfile(fp):
                              total_size += os.path.getsize(fp)
              except Exception:
                  pass
              return total_size

          for root, dirs, files in os.walk(repo_root):
              dirs[:] = [d for d in dirs if d not in exclude_dirs]
              
              items = []
              # Add parent link if not in root
              if os.path.relpath(root, repo_root) != ".":
                  items.append({"name": "..", "path": "../", "type": "dir", "size": 0})

              for d in sorted(dirs):
                  dir_full_path = os.path.join(root, d)
                  dir_size = get_dir_size(dir_full_path)
                  items.append({"name": d, "path": f"./{d}/", "type": "dir", "size": dir_size})
              
              for file in sorted(files):
                  if file == "index.html" and root == repo_root and os.path.exists(os.path.join(root, "index.html")):
                      continue
                  if file.startswith("."):
                      continue
                  file_path = os.path.join(root, file)
                  size = os.path.getsize(file_path) if os.path.isfile(file_path) else 0
                  items.append({"name": file, "path": f"./{file}", "type": "file", "size": size})

              index_content = template_html.replace(
                  "window.__TREE_DATA__ || []",
                  json.dumps(items, ensure_ascii=False)
              )

              target_index = os.path.join(root, "index.html")
              if not (root == repo_root and os.path.exists(target_index) and "__TREE_DATA__" not in open(target_index, encoding="utf-8", errors="ignore").read()):
                  with open(target_index, "w", encoding="utf-8") as f:
                      f.write(index_content)
          EOF
          echo "[INFO] File tree index pages generated."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4