name: Build Flatpak Repo and Deploy Pages

on:
  schedule:
    - cron: '0 12 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "[INFO] Importing GPG private key..."
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Setup Flathub Repository
        run: |
          echo "[INFO] Adding Flathub remote repository..."
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak Packages and Repository
        run: |
          set -euo pipefail

          python3 - << 'EOF' > /tmp/workflow_vars.sh
          import re, os

          config_file = ".github/env/config.yml"
          if not os.path.isfile(config_file):
              print("echo '[ERROR] .github/env/config.yml not found.'; exit 1")
              exit(1)

          cfg = {}
          with open(config_file, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  m = re.match(r"^([A-Za-z0-9_]+)\s*:\s*(.+)$", line)
                  if m:
                      k = m.group(1).strip()
                      v = m.group(2).split("#")[0].strip().strip('"').strip("'")
                      cfg[k] = v

          for k, v in cfg.items():
              print(f"export CFG_{k}='{v}'")
          EOF

          source /tmp/workflow_vars.sh
          rm -f /tmp/workflow_vars.sh

          CONFIG_FILE="${CFG_GET_FILE:-.github/env/get.yml}"
          REF_TEMPLATE="${CFG_REF_TEMPLATE:-.github/env/.flatpakref}"
          REPO_DIR="${CFG_REPO_DIR:-.}"
          BUILD_DIR="${CFG_BUILD_DIR:-build-dir}"
          PUBLIC_KEY_FILE="${REPO_DIR}/${CFG_PUBLIC_KEY_FILE:-PublicKey.txt}"
          GPG_KEY_ID="${CFG_GPG_KEY_ID:-C40563883002D85414F6517269B202E6183A72A2}"
          REPO_URL="${CFG_URL:-https://flrepo.onsy.qzz.io/}"

          if [ ! -f "${CONFIG_FILE}" ]; then
            echo "[ERROR] ${CONFIG_FILE} not found."
            exit 1
          fi

          if [ ! -d "${REPO_DIR}/objects" ]; then
            echo "[INFO] Initializing OSTree repository..."
            ostree init --mode=archive-z2 --repo="${REPO_DIR}"
          fi

          GPG_PUBLIC_KEY=""
          if [ -f "${PUBLIC_KEY_FILE}" ]; then
            GPG_PUBLIC_KEY=$(tr -d '\r\n' < "${PUBLIC_KEY_FILE}")
          fi

          export CONFIG_FILE
          python3 - << 'EOF' > /tmp/flatpak_targets.tsv
          import os, re

          def extract_branch(url, explicit_branch=None):
              if explicit_branch:
                  return explicit_branch.strip()
              m = re.search(r'/refs/heads/([^/]+)', url)
              if m:
                  return m.group(1)
              m = re.search(r'raw\.githubusercontent\.com/[^/]+/[^/]+/([^/]+)', url)
              if m:
                  return m.group(1)
              m = re.search(r'github\.com/[^/]+/[^/]+/(?:raw|blob)/([^/]+)', url)
              if m:
                  return m.group(1)
              return "master"

          config_file = os.environ.get("CONFIG_FILE", ".github/env/get.yml")
          with open(config_file, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  match = re.match(r"^([^:：]+)[:：]\s*(https?://\S+)(?:\s+(\S+))?", line)
                  if match:
                      app_name = match.group(1).strip()
                      manifest_url = match.group(2).strip()
                      explicit_branch = match.group(3)
                      branch = extract_branch(manifest_url, explicit_branch)
                      print(f"{app_name}\t{manifest_url}\t{branch}")
          EOF

          while IFS=$'\t' read -r APP_NAME MANIFEST_URL BRANCH || [ -n "${APP_NAME}" ]; do
            [ -z "${APP_NAME}" ] && continue
            BRANCH="${BRANCH:-master}"
            echo "[INFO] Processing ${APP_NAME} (branch: ${BRANCH}) from ${MANIFEST_URL}..."

            APP_TMP_DIR="tmp/${APP_NAME}"
            mkdir -p "${APP_TMP_DIR}"

            MANIFEST_EXT="${MANIFEST_URL##*.}"
            TEMP_MANIFEST="${APP_TMP_DIR}/manifest.${MANIFEST_EXT}"
            curl -fsSL "${MANIFEST_URL}" -o "${TEMP_MANIFEST}"

            export TEMP_MANIFEST MANIFEST_URL APP_TMP_DIR
            APP_ID=$(python3 - << 'EOF'
          import os, re, sys, urllib.parse, urllib.request

          manifest_path = os.environ["TEMP_MANIFEST"]
          manifest_url = os.environ["MANIFEST_URL"]
          target_dir = os.environ["APP_TMP_DIR"]

          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          id_match = re.search(r'^\s*[\"\'\']?(?:id|app-id)[\"\'\']?\s*:\s*[\"\'\']?([^\"\'\'\s,#]+)[\"\'\']?', content, re.MULTILINE)
          if not id_match:
              sys.exit(1)

          app_id = id_match.group(1)

          paths = re.findall(r'[\"\'\']?path[\"\'\']?\s*:\s*[\"\'\']?([^\"\'\'\s,#]+)[\"\'\']?', content)
          base_url = manifest_url.rsplit("/", 1)[0] + "/"

          for p in paths:
              if p.startswith("http://") or p.startswith("https://") or p.startswith("/"):
                  continue
              file_url = urllib.parse.urljoin(base_url, p)
              dest_path = os.path.join(target_dir, p)
              os.makedirs(os.path.dirname(dest_path), exist_ok=True)
              req = urllib.request.Request(file_url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as resp, open(dest_path, "wb") as out_f:
                  out_f.write(resp.read())

          print(app_id)
          EOF
          )

            if [ -z "${APP_ID}" ]; then
              echo "[ERROR] Could not extract app ID for ${APP_NAME}."
              exit 1
            fi

            echo "[INFO] Building ${APP_ID} on branch ${BRANCH}..."
            flatpak-builder \
              --user \
              --default-branch="${BRANCH}" \
              --install-deps-from=flathub \
              --disable-rofiles-fuse \
              --gpg-sign="${GPG_KEY_ID}" \
              --repo="${REPO_DIR}" \
              --force-clean \
              "${BUILD_DIR}" \
              "${TEMP_MANIFEST}"

            echo "[INFO] Creating single-file bundle: ${APP_NAME}.flatpak..."
            flatpak build-bundle \
              --gpg-sign="${GPG_KEY_ID}" \
              "${REPO_DIR}" \
              "${APP_NAME}.flatpak" \
              "${APP_ID}" \
              "${BRANCH}"

            if [ -f "${REF_TEMPLATE}" ]; then
              echo "[INFO] Generating ${APP_NAME}.flatpakref from template..."
              export REF_TEMPLATE REPO_DIR APP_ID APP_NAME BRANCH GPG_PUBLIC_KEY REPO_URL
              python3 - << 'EOF'
          import os, re

          template_path = os.environ["REF_TEMPLATE"]
          app_name = os.environ["APP_NAME"]
          output_path = os.path.join(os.environ["REPO_DIR"], f"{app_name}.flatpakref")
          app_id = os.environ["APP_ID"]
          branch = os.environ["BRANCH"]
          gpg_key = os.environ["GPG_PUBLIC_KEY"]
          repo_url = os.environ["REPO_URL"].rstrip('/') + '/'

          with open(template_path, 'r', encoding='utf-8') as f:
              content = f.read()

          content = content.replace("${APP_ID}", app_id).replace("$APP_ID", app_id)
          content = content.replace("${APP_NAME}", app_name).replace("$APP_NAME", app_name)
          content = content.replace("${BRANCH}", branch).replace("$BRANCH", branch)
          content = content.replace("${GPG_PUBLIC_KEY}", gpg_key).replace("${GPGKey}", gpg_key).replace("${GPG_KEY}", gpg_key)
          content = content.replace("${URL}/", repo_url).replace("$URL/", repo_url)
          content = content.replace("${URL}", repo_url).replace("$URL", repo_url)
          content = re.sub(r'^(Branch\s*=\s*).*$', r'\g<1>' + branch, content, flags=re.MULTILINE)

          with open(output_path, 'w', encoding='utf-8') as f:
              f.write(content)
          EOF
            fi

            rm -rf "${APP_TMP_DIR}" "${BUILD_DIR}"
          done < /tmp/flatpak_targets.tsv

          rm -rf tmp /tmp/flatpak_targets.tsv .flatpak-builder 2>/dev/null || true

          echo "[INFO] Updating repository summary and static deltas..."
          flatpak build-update-repo \
            --gpg-sign="${GPG_KEY_ID}" \
            --generate-static-deltas \
            "${REPO_DIR}"

          echo "[INFO] OSTree repository, flatpak bundles, and flatpakref files generated successfully."

      - name: Generate Directory Tree and Global Search Index
        run: |
          set -euo pipefail

          TEMPLATE_PATH=".github/pages/file_tree.html"
          if [ ! -f "${TEMPLATE_PATH}" ]; then
            echo "[WARN] Template ${TEMPLATE_PATH} not found. Skipping file tree index generation."
            exit 0
          fi

          echo "[INFO] Generating index.html and search_index.json..."
          python3 - << 'EOF'
          import os, json, re, urllib.parse

          config_file = ".github/env/config.yml"
          repo_url = "https://flrepo.onsy.qzz.io/"
          if os.path.isfile(config_file):
              with open(config_file, "r", encoding="utf-8") as f:
                  for line in f:
                      m = re.match(r"^URL\s*:\s*(.+)$", line.strip())
                      if m:
                          repo_url = m.group(1).split("#")[0].strip().strip('"').strip("'")
                          break

          parsed_url = urllib.parse.urlparse(repo_url)
          repo_base = parsed_url.path
          if not repo_base.endswith("/"):
              repo_base += "/"

          template_path = ".github/pages/file_tree.html"
          with open(template_path, "r", encoding="utf-8") as f:
              template_html = f.read()

          repo_root = "."
          exclude_dirs = {".git", ".github"}

          def get_dir_size(dir_path):
              total_size = 0
              try:
                  for root_dir, _, file_names in os.walk(dir_path):
                      for fn in file_names:
                          fp = os.path.join(root_dir, fn)
                          if os.path.isfile(fp):
                              total_size += os.path.getsize(fp)
              except Exception:
                  pass
              return total_size

          all_search_items = []

          for root, dirs, files in os.walk(repo_root):
              dirs[:] = [d for d in dirs if d not in exclude_dirs]
              rel_dir = os.path.relpath(root, repo_root)
              if rel_dir == ".":
                  rel_dir = ""

              items = []
              if rel_dir != "":
                  items.append({"name": "..", "path": "../", "type": "dir", "size": 0})

              for d in sorted(dirs):
                  dir_full_path = os.path.join(root, d)
                  dir_size = get_dir_size(dir_full_path)
                  items.append({"name": d, "path": f"./{d}/", "type": "dir", "size": dir_size})
                  rel_path = (os.path.join(rel_dir, d) + "/").replace("\\", "/")
                  all_search_items.append({"name": d, "path": rel_path, "type": "dir", "size": dir_size})

              for file in sorted(files):
                  if file.startswith(".") or file == "search_index.json":
                      continue
                  if file == "index.html" and rel_dir == "":
                      continue
                  file_path = os.path.join(root, file)
                  size = os.path.getsize(file_path) if os.path.isfile(file_path) else 0
                  items.append({"name": file, "path": f"./{file}", "type": "file", "size": size})
                  rel_path = os.path.join(rel_dir, file).replace("\\", "/")
                  all_search_items.append({"name": file, "path": rel_path, "type": "file", "size": size})

              index_content = template_html.replace(
                  "window.__TREE_DATA__ || []",
                  json.dumps(items, ensure_ascii=False)
              ).replace(
                  'window.__REPO_URL__ || ""',
                  json.dumps(repo_url)
              ).replace(
                  'window.__REPO_BASE__ || "/"',
                  json.dumps(repo_base)
              )

              target_index = os.path.join(root, "index.html")
              if not (rel_dir == "" and os.path.exists(target_index) and "__TREE_DATA__" not in open(target_index, encoding="utf-8", errors="ignore").read()):
                  with open(target_index, "w", encoding="utf-8") as f:
                      f.write(index_content)

          with open(os.path.join(repo_root, "search_index.json"), "w", encoding="utf-8") as f:
              json.dump(all_search_items, f, ensure_ascii=False)
          EOF
          echo "[INFO] Index pages and search index generated."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4