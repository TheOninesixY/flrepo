<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flrepo - File Tree</title>
  <style>
    :root {
      --sidebar-bg: #11527e;
      --sidebar-text: #ffffff;
      --content-bg: #ffffff;
      --text-main: #1f2328;
      --text-muted: #656d76;
      --border-color: #d0d7de;
      --hover-bg: #f3f4f6;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }

    body {
      display: flex;
      min-height: 100vh;
      font-family: var(--font-family);
      background-color: var(--content-bg);
      color: var(--text-main);
    }

    .sidebar {
      width: 280px;
      min-width: 280px;
      background-color: var(--sidebar-bg);
      color: var(--sidebar-text);
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .sidebar-title {
      font-size: 3rem;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .sidebar-subtitle {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      margin-top: 8px;
      opacity: 0.9;
    }

    .main-content {
      flex: 1;
      padding: 48px 48px;
      overflow-y: auto;
    }

    .path-header {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
    }

    .path-display-area {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      overflow-x: auto;
      white-space: nowrap;
      cursor: text;
      user-select: none;
      padding: 4px 0;
    }

    .path-segment {
      color: #0969da;
      text-decoration: none;
      font-weight: 500;
      padding: 2px 4px;
    }

    .path-segment:hover {
      text-decoration: underline;
      background-color: #eaf2ff;
    }

    .path-separator {
      color: var(--text-muted);
      font-weight: 400;
      padding: 0 2px;
    }

    .header-input {
      flex: 1;
      height: 32px;
      padding: 0 10px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      outline: none;
      background-color: #ffffff;
      box-shadow: none;
    }

    .header-input:focus {
      border-color: #8c959f;
      outline: none;
      box-shadow: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      background-color: var(--hover-bg);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .action-btn.active-style {
      background-color: var(--hover-bg);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .tree-container {
      list-style: none;
    }

    .tree-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-size: 0.95rem;
      text-decoration: none;
      color: var(--text-main);
      transition: background-color 0.15s ease;
      border-bottom: 1px solid #f6f8fa;
    }

    .tree-item:hover {
      background-color: var(--hover-bg);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-name {
      color: #0969da;
      font-weight: 500;
    }

    .item-name.directory {
      color: var(--text-main);
      font-weight: 600;
    }

    .item-parent-dir {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .empty-notice {
      padding: 16px 14px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        min-width: 100%;
        padding: 32px 24px;
      }
      .main-content {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <h1 class="sidebar-title">Flrepo</h1>
    <div class="sidebar-subtitle">FILE TREE</div>
  </aside>

  <main class="main-content">
    <div class="path-header" id="path-header">
      <div class="path-display-area" id="path-display" title="Double click to enter path">
        <span>Index of</span>
        <span id="breadcrumb-container"></span>
      </div>

      <input type="text" class="header-input" id="search-input" placeholder="Search entire repository..." style="display: none;">
      <input type="text" class="header-input" id="path-input" placeholder="Enter path e.g. root/objects/..." style="display: none;">

      <div class="header-actions">
        <button class="action-btn" id="search-btn" title="Search all files">
          <svg viewBox="0 0 16 16">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
          </svg>
        </button>
        <button class="action-btn active-style" id="close-input-btn" title="Close" style="display: none;">
          <svg viewBox="0 0 16 16">
            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
          </svg>
        </button>
      </div>
    </div>

    <ul class="tree-container" id="file-list">
      <!-- Items dynamically rendered -->
    </ul>
  </main>

  <script>
    const EXPECTED_URL = window.__REPO_URL__ || "";
    const REPO_BASE = window.__REPO_BASE__ || "/";
    const TREE_DATA = window.__TREE_DATA__ || [];
    let ALL_REPO_FILES = null;

    function verifyAndRedirectDomain() {
      if (!EXPECTED_URL) return true;
      try {
        const expected = new URL(EXPECTED_URL);
        const currentHostname = window.location.hostname;
        if (currentHostname !== "localhost" && currentHostname !== "127.0.0.1" && currentHostname !== expected.hostname) {
          const targetLocation = expected.origin + (expected.pathname.endsWith('/') ? expected.pathname.slice(0, -1) : expected.pathname) + window.location.pathname + window.location.search + window.location.hash;
          window.location.replace(targetLocation);
          return false;
        }
      } catch (err) {
        return true;
      }
      return true;
    }

    function formatSize(bytes) {
      if (bytes === 0) return "0 B";
      if (!bytes || isNaN(bytes)) return "-";
      const units = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(1) + " " + units[i];
    }

    function getRelativeSegments() {
      let rawPath = window.location.pathname;
      if (!rawPath.endsWith("/")) {
        rawPath += "/";
      }
      let subPath = rawPath.startsWith(REPO_BASE) ? rawPath.slice(REPO_BASE.length) : rawPath;
      return subPath.split("/").filter(Boolean);
    }

    function renderBreadcrumbs() {
      const container = document.getElementById("breadcrumb-container");
      container.innerHTML = "";

      const segments = getRelativeSegments();

      const rootLink = document.createElement("a");
      rootLink.className = "path-segment";
      rootLink.href = REPO_BASE;
      rootLink.textContent = "root";
      container.appendChild(rootLink);

      let accumulated = REPO_BASE;
      segments.forEach((seg) => {
        const sep = document.createElement("span");
        sep.className = "path-separator";
        sep.textContent = "/";
        container.appendChild(sep);

        accumulated += seg + "/";
        const link = document.createElement("a");
        link.className = "path-segment";
        link.href = accumulated;
        link.textContent = seg;
        container.appendChild(link);
      });
    }

    function renderLocalItems() {
      const container = document.getElementById("file-list");
      if (!TREE_DATA.length) {
        container.innerHTML = '<li class="empty-notice">Empty directory.</li>';
        return;
      }

      container.innerHTML = TREE_DATA.map(item => `
        <li>
          <a class="tree-item" href="${item.path}">
            <div class="item-left">
              <span class="item-name ${item.type === 'dir' ? 'directory' : ''}">${item.name}${item.type === 'dir' ? '/' : ''}</span>
            </div>
            <div class="item-meta">
              ${item.name === '..' ? '-' : formatSize(item.size)}
            </div>
          </a>
        </li>
      `).join("");
    }

    function renderSearchResults(results, keyword) {
      const container = document.getElementById("file-list");
      if (!results.length) {
        container.innerHTML = `<li class="empty-notice">No files matching "${keyword}" found.</li>`;
        return;
      }

      container.innerHTML = results.map(item => {
        const targetUrl = REPO_BASE + item.path;
        return `
          <li>
            <a class="tree-item" href="${targetUrl}">
              <div class="item-left">
                <span class="item-name ${item.type === 'dir' ? 'directory' : ''}">${item.name}${item.type === 'dir' ? '/' : ''}</span>
                <span class="item-parent-dir">root/${item.path}</span>
              </div>
              <div class="item-meta">
                ${formatSize(item.size)}
              </div>
            </a>
          </li>
        `;
      }).join("");
    }

    async function ensureIndexLoaded() {
      if (ALL_REPO_FILES !== null) return;
      try {
        const res = await fetch(REPO_BASE + "search_index.json");
        if (res.ok) {
          ALL_REPO_FILES = await res.json();
        } else {
          ALL_REPO_FILES = [];
        }
      } catch (err) {
        ALL_REPO_FILES = [];
      }
    }

    function initControls() {
      const displayArea = document.getElementById("path-display");
      const searchInput = document.getElementById("search-input");
      const pathInput = document.getElementById("path-input");
      const searchBtn = document.getElementById("search-btn");
      const closeBtn = document.getElementById("close-input-btn");

      function showMode(mode) {
        displayArea.style.display = mode === "display" ? "flex" : "none";
        searchInput.style.display = mode === "search" ? "block" : "none";
        pathInput.style.display = mode === "path" ? "block" : "none";
        searchBtn.style.display = mode === "display" ? "inline-flex" : "none";
        closeBtn.style.display = mode === "display" ? "none" : "inline-flex";

        if (mode === "search") {
          ensureIndexLoaded();
          searchInput.focus();
        } else if (mode === "path") {
          const segments = getRelativeSegments();
          pathInput.value = segments.length ? "root/" + segments.join("/") + "/" : "root/";
          pathInput.focus();
          pathInput.select();
        } else {
          searchInput.value = "";
          renderLocalItems();
        }
      }

      searchBtn.addEventListener("click", () => showMode("search"));
      closeBtn.addEventListener("click", () => showMode("display"));

      displayArea.addEventListener("dblclick", (e) => {
        if (e.target.tagName.toLowerCase() === "a") return;
        showMode("path");
      });

      searchInput.addEventListener("input", async (e) => {
        const keyword = e.target.value.trim().toLowerCase();
        if (!keyword) {
          renderLocalItems();
          return;
        }

        await ensureIndexLoaded();
        const results = (ALL_REPO_FILES || []).filter(item => {
          return item.name.toLowerCase().includes(keyword);
        });
        renderSearchResults(results, keyword);
      });

      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Escape") showMode("display");
      });

      pathInput.addEventListener("keydown", async (e) => {
        if (e.key === "Escape") {
          showMode("display");
        } else if (e.key === "Enter") {
          let inputVal = pathInput.value.trim();
          if (!inputVal) return;

          if (inputVal.startsWith("root/")) {
            inputVal = inputVal.slice("root/".length);
          } else if (inputVal === "root" || inputVal === "/") {
            inputVal = "";
          }

          if (inputVal.startsWith("/")) {
            inputVal = inputVal.slice(1);
          }

          let resolvedUrl = REPO_BASE + inputVal;
          if (inputVal && !resolvedUrl.endsWith("/")) {
            resolvedUrl += "/";
          }

          try {
            const checkUrl = resolvedUrl.endsWith("/") ? resolvedUrl + "index.html" : resolvedUrl;
            const res = await fetch(checkUrl, { method: "HEAD" });
            if (res.ok) {
              window.location.href = resolvedUrl;
            } else {
              window.location.href = REPO_BASE;
            }
          } catch (err) {
            window.location.href = REPO_BASE;
          }
        }
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (!verifyAndRedirectDomain()) return;
      renderBreadcrumbs();
      renderLocalItems();
      initControls();
    });
  </script>
</body>
</html>
