<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - Flrepo</title>
  <style>
    :root {
      --sidebar-bg: #11527e;
      --sidebar-text: #ffffff;
      --content-bg: #ffffff;
      --text-main: #1f2328;
      --text-muted: #656d76;
      --border-color: #d0d7de;
      --hover-bg: #f3f4f6;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }

    body {
      display: flex;
      min-height: 100vh;
      font-family: var(--font-family);
      background-color: var(--content-bg);
      color: var(--text-main);
    }

    .sidebar {
      width: 280px;
      min-width: 280px;
      background-color: var(--sidebar-bg);
      color: var(--sidebar-text);
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .sidebar-title {
      font-size: 3rem;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .sidebar-subtitle {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      margin-top: 8px;
      opacity: 0.9;
    }

    .path-header {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      min-height: 48px;
    }

    .path-segment {
      color: #0969da;
      text-decoration: none;
      font-weight: 500;
      padding: 2px 4px;
    }

    .path-segment:hover {
      text-decoration: underline;
      background-color: #eaf2ff;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 0;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .error-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .back-link {
      margin-top: 32px;
      font-size: 0.95rem;
      color: #0969da;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        min-width: 100%;
        padding: 32px 24px;
      }
      .main-content {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <h1 class="sidebar-title">Flrepo</h1>
    <div class="sidebar-subtitle">FILE TREE</div>
  </aside>

    <div class="empty-state">
      <div class="error-code">404</div>
      <div class="error-desc">你来到了一个如同我的心般空虚的地方</div>
      <a class="back-link" href="/">Back to root</a>
    </div>
  </main>

  <script>
    const EXPECTED_URL = window.__REPO_URL__ || "";

    function verifyAndRedirectDomain() {
      if (!EXPECTED_URL) return true;
      try {
        const expected = new URL(EXPECTED_URL);
        const currentHostname = window.location.hostname;
        if (currentHostname !== "localhost" && currentHostname !== "127.0.0.1" && currentHostname !== expected.hostname) {
          window.location.replace(EXPECTED_URL);
          return false;
        }
      } catch (err) {
        return true;
      }
      return true;
    }

    document.addEventListener("DOMContentLoaded", () => {
      verifyAndRedirectDomain();
    });
  </script>
</body>
</html>
